name: Diagnostic
on:
  push:
    branches: [ interface-pro ]
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      - run: flutter pub get
      - name: Analyse et tests
        run: |
          mkdir -p /tmp/out
          flutter analyze --no-fatal-infos > /tmp/out/analyze.txt 2>&1 || true
          flutter test > /tmp/out/test.txt 2>&1 || true
      - name: Publier les rapports
        run: |
          git config user.name "ci"; git config user.email "ci@example.com"
          git fetch origin ci-logs || true
          git checkout --orphan logs-tmp
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/out/*.txt .
          git add analyze.txt test.txt
          git commit -m "Rapports diag $GITHUB_SHA"
          git push -f origin logs-tmp:ci-logs
