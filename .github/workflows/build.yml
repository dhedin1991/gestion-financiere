name: Build APK and Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - run: flutter create --platforms=android --project-name gestion_financiere .
      - run: sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle.kts
      - run: sed -i '/android {/a\    ndkVersion = "27.0.12077973"' android/app/build.gradle.kts
      - name: Activer le core library desugaring (requis par flutter_local_notifications)
        run: |
          cat >> android/app/build.gradle.kts << 'EOF'

          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF
      - name: Ajout permission Internet et autorisation Wi-Fi local (synchronisation)
        run: |
          sed -i '/<manifest xmlns:android/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/a\        android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Analyse statique (flutter analyze)
        run: |
          flutter analyze --no-fatal-infos > /tmp/analyze.log 2>&1 || ANALYZE_FAILED=1
          cat /tmp/analyze.log
          if [ "$ANALYZE_FAILED" = "1" ]; then
            echo "::error::flutter analyze a détecté des problèmes — voir le log ci-dessus."
            exit 1
          fi
      - name: Run tests
        run: |
          flutter test --coverage > /tmp/test.log 2>&1 || TEST_FAILED=1
          if [ "$TEST_FAILED" = "1" ]; then
            grep -A6 -iE "^\s*(Expected|Actual|which:|EXCEPTION|FAILED|Error:|Failed to load)" /tmp/test.log | tail -60 | while IFS= read -r line; do
              clean=$(echo "$line" | sed 's/%/%25/g' | cut -c1-500)
              echo "::error::$clean"
            done
            exit 1
          fi
      - name: Publier la couverture de tests
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
      - name: Build APK
        # NOTE (audit) : cet APK est signé avec la clé de debug par défaut
        # de Flutter, pas une clé de release dédiée. C'est suffisant pour
        # une installation manuelle personnelle, mais PAS pour publier sur
        # le Play Store (qui exige une clé de release + app signing Google
        # Play). Pour signer correctement : générer un keystore, l'ajouter
        # en secret GitHub (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
        # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD), le décoder ici dans
        # android/app/upload-keystore.jks, et référencer un android/key.properties
        # dans la config Gradle avant `flutter build apk --release`.
        run: |
          flutter build apk --release > /tmp/build.log 2>&1 || BUILD_FAILED=1
          if [ "$BUILD_FAILED" = "1" ]; then
            grep -iE "error|exception|failure" /tmp/build.log | tail -15 | while IFS= read -r line; do
              clean=$(echo "$line" | sed 's/%/%25/g' | cut -c1-500)
              echo "::error::$clean"
            done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - run: flutter create --platforms=windows --project-name gestion_financiere .
      - run: flutter pub get
      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: build/windows/x64/runner/Release
