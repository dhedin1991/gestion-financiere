name: Build APK and Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - run: flutter create --platforms=android --project-name gestion_financiere .
      - run: flutter pub get && dart run flutter_launcher_icons
      - name: Vérifier l'icône Android (échoue si l'icône par défaut de Flutter reste en place)
        run: |
          set -e
          R=android/app/src/main/res
          test -f $R/mipmap-xxxhdpi/ic_launcher.png
          test -f $R/mipmap-anydpi-v26/ic_launcher.xml
          grep -q "ic_launcher_foreground" $R/mipmap-anydpi-v26/ic_launcher.xml
          grep -rq "0B1220" $R/values/colors.xml
          grep -q '@mipmap/ic_launcher' android/app/src/main/AndroidManifest.xml
          find $R -name "ic_launcher*" | sort
      - run: sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle.kts
      - run: sed -i '/android {/a\    ndkVersion = "27.0.12077973"' android/app/build.gradle.kts
      - name: Activer le core library desugaring (requis par flutter_local_notifications)
        run: |
          cat >> android/app/build.gradle.kts << 'EOF'

          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF
      - name: Manifest Android (Internet, sync Wi-Fi, notifications programmées)
        run: |
          python3 - << 'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = [
              'android.permission.INTERNET',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.VIBRATE',
              'android.permission.POST_NOTIFICATIONS',
          ]
          perm_xml = ''.join('    <uses-permission android:name="%s"/>\n' % x for x in perms)
          s = re.sub(r'(<manifest[^>]*>)', lambda m: m.group(1) + '\n' + perm_xml, s, count=1)
          s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          receivers = """
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                  </intent-filter>
              </receiver>
          """
          s = s.replace('</application>', receivers + '</application>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -c "ScheduledNotificationReceiver" android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Bibliothèque SQLite (tests d'intégration des migrations)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev
      - name: Analyse statique (flutter analyze)
        run: |
          flutter analyze --no-fatal-infos > /tmp/analyze.log 2>&1 || ANALYZE_FAILED=1
          cat /tmp/analyze.log
          if [ "$ANALYZE_FAILED" = "1" ]; then
            echo "::error::flutter analyze a détecté des problèmes — voir le log ci-dessus."
            exit 1
          fi
      - name: Run tests
        run: |
          flutter test --coverage > /tmp/test.log 2>&1 || TEST_FAILED=1
          if [ "$TEST_FAILED" = "1" ]; then
            grep -A6 -iE "^\s*(Expected|Actual|which:|EXCEPTION|FAILED|Error:|Failed to load)" /tmp/test.log | tail -60 | while IFS= read -r line; do
              clean=$(echo "$line" | sed 's/%/%25/g' | cut -c1-500)
              echo "::error::$clean"
            done
            exit 1
          fi
      - name: Publier la couverture de tests
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
      - name: Signature de l'APK (clé permanente, secret ANDROID_KEYSTORE_PASSPHRASE)
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSPHRASE }}
        run: |
          if [ -n "$KS_PASS" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -in android-signing/release.jks.enc -out android/app/release.jks -pass env:KS_PASS
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=gestion\nstoreFile=release.jks\n' "$KS_PASS" "$KS_PASS" > android/key.properties
            cat >> android/app/build.gradle.kts << 'EOF'

          val keyPropsFile = rootProject.file("key.properties")
          if (keyPropsFile.exists()) {
              // Lecture manuelle : dans un script Gradle, « java.util » est
              // masqué par l'extension « java » du projet.
              val keyProps = keyPropsFile.readLines()
                  .filter { it.contains("=") }
                  .associate { it.substringBefore("=") to it.substringAfter("=") }
              android {
                  signingConfigs {
                      create("release") {
                          keyAlias = keyProps.getValue("keyAlias")
                          keyPassword = keyProps.getValue("keyPassword")
                          storeFile = file(keyProps.getValue("storeFile"))
                          storePassword = keyProps.getValue("storePassword")
                      }
                  }
                  buildTypes {
                      getByName("release") {
                          signingConfig = signingConfigs.getByName("release")
                      }
                  }
              }
          }
          EOF
            echo "APK signé avec la clé permanente."
          else
            echo "::warning::Secret ANDROID_KEYSTORE_PASSPHRASE absent : APK signé avec la clé de debug. Impossible de l'installer par-dessus une version précédente (désinstallation = perte des données locales) : exporte une sauvegarde avant."
          fi
      - name: Build APK
        # --no-shrink : désactive R8. Sans règles ProGuard dédiées, R8 casse
        # les notifications programmées (flutter_local_notifications) en
        # version release.
        run: |
          flutter build apk --release --no-shrink > /tmp/build.log 2>&1 || BUILD_FAILED=1
          if [ "$BUILD_FAILED" = "1" ]; then
            grep -iE "error|exception|failure" /tmp/build.log | tail -15 | while IFS= read -r line; do
              clean=$(echo "$line" | sed 's/%/%25/g' | cut -c1-500)
              echo "::error::$clean"
            done
            exit 1
          fi

      - name: Publier le journal d'échec du build (branche ci-logs)
        if: failure()
        run: |
          mkdir -p /tmp/rep
          tail -c 15000 /tmp/build.log > /tmp/rep/build_tail.txt || true
          cd /tmp/rep
          git init -q
          git checkout -q -b ci-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          echo "${{ github.sha }}" > sha.txt
          git add .
          git commit -q -m "journal d'échec ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publier l'APK dans la Release « dernier-build »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dernier-build >/dev/null 2>&1 || gh release create dernier-build --title "Dernier build" --notes "Derniers logiciels compilés (APK Android et Windows)."
          cp build/app/outputs/flutter-apk/app-release.apk GestionFinanciere-Android.apk
          gh release upload dernier-build GestionFinanciere-Android.apk --clobber

  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - run: flutter create --platforms=windows --project-name gestion_financiere .
      - run: flutter pub get && dart run flutter_launcher_icons -f flutter_launcher_icons-windows.yaml
      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-windows
          path: build/windows/x64/runner/Release
      - name: Publier Windows dans la Release « dernier-build »
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dernier-build >/dev/null 2>&1 || gh release create dernier-build --title "Dernier build" --notes "Derniers logiciels compilés (APK Android et Windows)." || true
          powershell -Command "Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath GestionFinanciere-Windows.zip -Force"
          gh release upload dernier-build GestionFinanciere-Windows.zip --clobber
