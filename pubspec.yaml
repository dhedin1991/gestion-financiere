name: gestion_financiere
description: "Application personnelle de gestion financière - Bénin"
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Gestion d'état + Injection de dépendances
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Base de données locale
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3     # nécessaire pour Windows/Linux/macOS
  sqlite3: ^2.4.0                # chargement de la bibliothèque SQLite sous Windows
  path: ^1.9.0
  path_provider: ^2.1.3

  # Formatage devises / dates (utile pour le XOF et les autres devises)
  intl: ^0.20.2

  # Icônes modernes
  cupertino_icons: ^1.0.6

  # Chiffrement des exports (sauvegarde, CSV, PDF) par mot de passe
  encrypt: ^5.0.3

  # Verrouillage par code PIN (stockage sécurisé du hash)
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0   # empreinte digitale (Android)
  crypto: ^3.0.5

  # Graphiques (Bilans)
  fl_chart: ^0.69.0

  # Synchronisation Wi-Fi locale
  http: ^1.2.0

  # Export de relevés (PDF / CSV)
  pdf: ^3.11.1
  csv: ^6.0.0
  share_plus: ^7.2.2

  # Rappels (échéances crédits/dettes, dépassements de budget)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Sauvegarde / restauration manuelle
  file_picker: ^8.1.2

  # Mémorisation des préférences (thème clair/sombre)
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans_400Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans_500Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans_700Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto_700Bold.ttf
          weight: 700
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans_400Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans_500Medium.ttf
          weight: 500
        - asset: assets/fonts/OpenSans_700Bold.ttf
          weight: 700
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3_400Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3_500Medium.ttf
          weight: 500
        - asset: assets/fonts/SourceSans3_700Bold.ttf
          weight: 700
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato_700Bold.ttf
          weight: 700
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible_400Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegible_700Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  # Icône classique : carré plein (pas de coins transparents).
  image_path: "assets/icon_android.png"
  # Icône adaptative (Android 8+) : fond marine + logo seul dans la zone sûre.
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  min_sdk_android: 21
